<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter | Tools Bazar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #8B0000; /* Dark red */
            --secondary-color: #1A1A1A; /* Dark black */
            --accent-color: #FF4444;
            --text-color: #E0E0E0;
            --light-gray: #333333;
            --border-color: #444444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--secondary-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .converter-container {
            background-color: var(--secondary-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 800px;
            padding: 25px;
        }

        h1 {
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .converter-controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .input-group {
            flex: 1;
            min-width: 150px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #AAAAAA;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background-color: var(--light-gray);
            color: var(--text-color);
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(139, 0, 0, 0.2);
        }

        .swap-btn {
            display: flex;
            align-items: flex-end;
            height: 40px;
        }

        .swap-btn button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .swap-btn button:hover {
            background-color: var(--accent-color);
        }

        .system-toggle {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .system-toggle button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: var(--light-gray);
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .system-toggle button.active {
            background-color: var(--primary-color);
            color: white;
        }

        .system-toggle button:hover:not(.active) {
            background-color: #444444;
        }

        .result-container {
            background-color: var(--light-gray);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            border-left: 4px solid var(--primary-color);
        }

        .result-box {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 15px;
        }

        #result-value {
            font-size: 32px;
            font-weight: bold;
            color: white;
        }

        #result-unit {
            font-size: 18px;
            color: #AAAAAA;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-buttons button:hover {
            background-color: var(--accent-color);
        }

        .action-buttons button:last-child {
            background-color: #444444;
        }

        .action-buttons button:last-child:hover {
            background-color: #555555;
        }

        .conversion-table {
            width: 100%;
            overflow-x: auto;
        }

        .conversion-table h3 {
            margin-bottom: 15px;
            color: #AAAAAA;
            font-size: 16px;
            font-weight: normal;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 500;
        }

        tr.highlight-row {
            background-color: rgba(139, 0, 0, 0.2);
        }

        tr:hover {
            background-color: rgba(139, 0, 0, 0.1);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .input-row {
                flex-direction: column;
            }
            
            .swap-btn {
                align-self: center;
                margin: 10px 0;
            }
            
            .converter-container {
                padding: 15px;
            }
            
            h1 {
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .action-buttons button span {
                display: none;
            }
            
            .action-buttons button i {
                margin-right: 0;
            }
        }
    </style>
</head>
<body>
    <div class="converter-container">
        <h1><i class="fas fa-exchange-alt"></i> Unit Converter</h1>
        
        <div class="converter-controls">
            <div class="input-group">
                <label for="category">Select Category:</label>
                <select id="category" class="select-box">
                    <option value="length">Length</option>
                    <option value="weight">Weight</option>
                    <option value="temperature">Temperature</option>
                    <option value="volume">Volume</option>
                    <option value="area">Area</option>
                    <option value="speed">Speed</option>
                    <option value="time">Time</option>
                    <option value="energy">Energy</option>
                    <option value="power">Power</option>
                    <option value="pressure">Pressure</option>
                    <option value="data">Data / Digital Storage</option>
                    <option value="frequency">Frequency</option>
                    <option value="density">Density</option>
                    <option value="angle">Angle</option>
                </select>
            </div>
            
            <div class="input-row">
                <div class="input-group">
                    <label for="from-value">Value:</label>
                    <input type="number" id="from-value" placeholder="Enter value" step="any">
                </div>
                
                <div class="input-group">
                    <label for="from-unit">From Unit:</label>
                    <select id="from-unit" class="select-box"></select>
                </div>
                
                <div class="swap-btn">
                    <button id="swap-units" title="Swap units"><i class="fas fa-random"></i></button>
                </div>
                
                <div class="input-group">
                    <label for="to-unit">To Unit:</label>
                    <select id="to-unit" class="select-box"></select>
                </div>
            </div>
            
            <div class="system-toggle">
                <button id="metric-btn" class="active">Metric</button>
                <button id="imperial-btn">Imperial</button>
            </div>
        </div>
        
        <div class="result-container">
            <div class="result-box">
                <span id="result-value">0</span>
                <span id="result-unit"></span>
            </div>
            <div class="action-buttons">
                <button id="clear-btn"><i class="fas fa-broom"></i> Clear</button>
                <button id="copy-btn"><i class="fas fa-copy"></i> Copy</button>
            </div>
        </div>
        
        <div class="conversion-table">
            <h3>Common Conversions</h3>
            <table id="conversion-results">
                <!-- Results will be populated here -->
            </table>
        </div>
    </div>

    <script>
        // Unit definitions
        const units = {
            length: {
                metric: [
                    { name: 'Millimeter', symbol: 'mm', factor: 0.001 },
                    { name: 'Centimeter', symbol: 'cm', factor: 0.01 },
                    { name: 'Meter', symbol: 'm', factor: 1 },
                    { name: 'Kilometer', symbol: 'km', factor: 1000 }
                ],
                imperial: [
                    { name: 'Inch', symbol: 'in', factor: 0.0254 },
                    { name: 'Foot', symbol: 'ft', factor: 0.3048 },
                    { name: 'Yard', symbol: 'yd', factor: 0.9144 },
                    { name: 'Mile', symbol: 'mi', factor: 1609.344 }
                ]
            },
            weight: {
                metric: [
                    { name: 'Milligram', symbol: 'mg', factor: 0.000001 },
                    { name: 'Gram', symbol: 'g', factor: 0.001 },
                    { name: 'Kilogram', symbol: 'kg', factor: 1 },
                    { name: 'Tonne', symbol: 't', factor: 1000 }
                ],
                imperial: [
                    { name: 'Ounce', symbol: 'oz', factor: 0.0283495 },
                    { name: 'Pound', symbol: 'lb', factor: 0.453592 },
                    { name: 'Stone', symbol: 'st', factor: 6.35029 },
                    { name: 'US Ton', symbol: 'ton (US)', factor: 907.185 }
                ]
            },
            temperature: {
                metric: [
                    { name: 'Celsius', symbol: '°C', factor: 1, offset: 0 }
                ],
                imperial: [
                    { name: 'Fahrenheit', symbol: '°F', factor: 1, offset: 32 }
                ],
                special: [
                    { name: 'Kelvin', symbol: 'K', factor: 1, offset: 273.15 }
                ]
            },
            volume: {
                metric: [
                    { name: 'Milliliter', symbol: 'mL', factor: 0.001 },
                    { name: 'Liter', symbol: 'L', factor: 1 },
                    { name: 'Cubic Meter', symbol: 'm³', factor: 1000 }
                ],
                imperial: [
                    { name: 'Fluid Ounce', symbol: 'fl oz', factor: 0.0295735 },
                    { name: 'Cup', symbol: 'cup', factor: 0.236588 },
                    { name: 'Pint', symbol: 'pt', factor: 0.473176 },
                    { name: 'Quart', symbol: 'qt', factor: 0.946353 },
                    { name: 'Gallon', symbol: 'gal', factor: 3.78541 }
                ]
            },
            area: {
                metric: [
                    { name: 'Square Millimeter', symbol: 'mm²', factor: 0.000001 },
                    { name: 'Square Centimeter', symbol: 'cm²', factor: 0.0001 },
                    { name: 'Square Meter', symbol: 'm²', factor: 1 },
                    { name: 'Hectare', symbol: 'ha', factor: 10000 },
                    { name: 'Square Kilometer', symbol: 'km²', factor: 1000000 }
                ],
                imperial: [
                    { name: 'Square Inch', symbol: 'in²', factor: 0.00064516 },
                    { name: 'Square Foot', symbol: 'ft²', factor: 0.092903 },
                    { name: 'Square Yard', symbol: 'yd²', factor: 0.836127 },
                    { name: 'Acre', symbol: 'ac', factor: 4046.86 },
                    { name: 'Square Mile', symbol: 'mi²', factor: 2589988.11 }
                ]
            },
            speed: {
                metric: [
                    { name: 'Meter per Second', symbol: 'm/s', factor: 1 },
                    { name: 'Kilometer per Hour', symbol: 'km/h', factor: 0.277778 }
                ],
                imperial: [
                    { name: 'Mile per Hour', symbol: 'mph', factor: 0.44704 },
                    { name: 'Foot per Second', symbol: 'ft/s', factor: 0.3048 },
                    { name: 'Knot', symbol: 'kn', factor: 0.514444 }
                ]
            },
            time: {
                metric: [
                    { name: 'Millisecond', symbol: 'ms', factor: 0.001 },
                    { name: 'Second', symbol: 's', factor: 1 },
                    { name: 'Minute', symbol: 'min', factor: 60 },
                    { name: 'Hour', symbol: 'h', factor: 3600 },
                    { name: 'Day', symbol: 'd', factor: 86400 }
                ],
                imperial: [
                    { name: 'Week', symbol: 'wk', factor: 604800 },
                    { name: 'Month', symbol: 'mo', factor: 2628000 },
                    { name: 'Year', symbol: 'yr', factor: 31536000 }
                ]
            },
            energy: {
                metric: [
                    { name: 'Joule', symbol: 'J', factor: 1 },
                    { name: 'Kilojoule', symbol: 'kJ', factor: 1000 },
                    { name: 'Calorie', symbol: 'cal', factor: 4.184 },
                    { name: 'Kilocalorie', symbol: 'kcal', factor: 4184 }
                ],
                imperial: [
                    { name: 'British Thermal Unit', symbol: 'BTU', factor: 1055.06 },
                    { name: 'Foot-pound', symbol: 'ft-lb', factor: 1.35582 },
                    { name: 'Electronvolt', symbol: 'eV', factor: 1.60218e-19 }
                ]
            },
            power: {
                metric: [
                    { name: 'Watt', symbol: 'W', factor: 1 },
                    { name: 'Kilowatt', symbol: 'kW', factor: 1000 },
                    { name: 'Megawatt', symbol: 'MW', factor: 1000000 },
                    { name: 'Horsepower (metric)', symbol: 'PS', factor: 735.499 }
                ],
                imperial: [
                    { name: 'Horsepower (imperial)', symbol: 'hp', factor: 745.7 },
                    { name: 'Foot-pound per second', symbol: 'ft-lb/s', factor: 1.35582 },
                    { name: 'BTU per hour', symbol: 'BTU/h', factor: 0.293071 }
                ]
            },
            pressure: {
                metric: [
                    { name: 'Pascal', symbol: 'Pa', factor: 1 },
                    { name: 'Kilopascal', symbol: 'kPa', factor: 1000 },
                    { name: 'Bar', symbol: 'bar', factor: 100000 },
                    { name: 'Atmosphere', symbol: 'atm', factor: 101325 }
                ],
                imperial: [
                    { name: 'Pound per square inch', symbol: 'psi', factor: 6894.76 },
                    { name: 'Torr', symbol: 'Torr', factor: 133.322 },
                    { name: 'Inch of mercury', symbol: 'inHg', factor: 3386.39 }
                ]
            },
            data: {
                metric: [
                    { name: 'Bit', symbol: 'b', factor: 1 },
                    { name: 'Byte', symbol: 'B', factor: 8 },
                    { name: 'Kilobit', symbol: 'Kb', factor: 1000 },
                    { name: 'Kilobyte', symbol: 'KB', factor: 8000 },
                    { name: 'Megabit', symbol: 'Mb', factor: 1000000 },
                    { name: 'Megabyte', symbol: 'MB', factor: 8000000 },
                    { name: 'Gigabit', symbol: 'Gb', factor: 1000000000 },
                    { name: 'Gigabyte', symbol: 'GB', factor: 8000000000 },
                    { name: 'Terabit', symbol: 'Tb', factor: 1000000000000 },
                    { name: 'Terabyte', symbol: 'TB', factor: 8000000000000 }
                ],
                binary: [
                    { name: 'Kibibit', symbol: 'Kib', factor: 1024 },
                    { name: 'Kibibyte', symbol: 'KiB', factor: 8192 },
                    { name: 'Mebibit', symbol: 'Mib', factor: 1048576 },
                    { name: 'Mebibyte', symbol: 'MiB', factor: 8388608 },
                    { name: 'Gibibit', symbol: 'Gib', factor: 1073741824 },
                    { name: 'Gibibyte', symbol: 'GiB', factor: 8589934592 },
                    { name: 'Tebibit', symbol: 'Tib', factor: 1099511627776 },
                    { name: 'Tebibyte', symbol: 'TiB', factor: 8796093022208 }
                ]
            },
            frequency: {
                metric: [
                    { name: 'Hertz', symbol: 'Hz', factor: 1 },
                    { name: 'Kilohertz', symbol: 'kHz', factor: 1000 },
                    { name: 'Megahertz', symbol: 'MHz', factor: 1000000 },
                    { name: 'Gigahertz', symbol: 'GHz', factor: 1000000000 }
                ],
                special: [
                    { name: 'Radian per second', symbol: 'rad/s', factor: 0.159155 }
                ]
            },
            density: {
                metric: [
                    { name: 'Kilogram per cubic meter', symbol: 'kg/m³', factor: 1 },
                    { name: 'Gram per cubic centimeter', symbol: 'g/cm³', factor: 1000 }
                ],
                imperial: [
                    { name: 'Pound per cubic foot', symbol: 'lb/ft³', factor: 16.0185 },
                    { name: 'Pound per cubic inch', symbol: 'lb/in³', factor: 27679.9 }
                ]
            },
            angle: {
                metric: [
                    { name: 'Degree', symbol: '°', factor: 1 },
                    { name: 'Gradian', symbol: 'grad', factor: 0.9 }
                ],
                special: [
                    { name: 'Radian', symbol: 'rad', factor: 57.2958 },
                    { name: 'Milliradian', symbol: 'mrad', factor: 0.0572958 },
                    { name: 'Arcminute', symbol: "'", factor: 1/60 },
                    { name: 'Arcsecond', symbol: '"', factor: 1/3600 }
                ]
            }
        };

        // DOM elements
        const categorySelect = document.getElementById('category');
        const fromValueInput = document.getElementById('from-value');
        const fromUnitSelect = document.getElementById('from-unit');
        const toUnitSelect = document.getElementById('to-unit');
        const resultValueSpan = document.getElementById('result-value');
        const resultUnitSpan = document.getElementById('result-unit');
        const swapButton = document.getElementById('swap-units');
        const clearButton = document.getElementById('clear-btn');
        const copyButton = document.getElementById('copy-btn');
        const metricButton = document.getElementById('metric-btn');
        const imperialButton = document.getElementById('imperial-btn');
        const conversionResultsTable = document.getElementById('conversion-results');

        let currentSystem = 'metric';

        // Initialize the converter
        function initConverter() {
            populateCategoryOptions();
            updateUnitOptions();
            attachEventListeners();
            updateResults();
        }

        // Populate category dropdown
        function populateCategoryOptions() {
            Object.keys(units).forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category.charAt(0).toUpperCase() + category.slice(1);
                if (category === 'data') {
                    option.textContent = 'Data / Digital Storage';
                }
                categorySelect.appendChild(option);
            });
        }

        // Update unit options based on selected category and system
        function updateUnitOptions() {
            const category = categorySelect.value;
            const isTemperature = category === 'temperature';
            const isData = category === 'data';
            
            // Clear existing options
            fromUnitSelect.innerHTML = '';
            toUnitSelect.innerHTML = '';
            
            // Add metric units
            units[category].metric.forEach(unit => {
                addUnitOption(fromUnitSelect, unit);
                addUnitOption(toUnitSelect, unit);
            });
            
            // Add imperial/binary units
            if (currentSystem === 'imperial' || isTemperature || isData) {
                const systemKey = isData ? 'binary' : 'imperial';
                units[category][systemKey].forEach(unit => {
                    addUnitOption(fromUnitSelect, unit);
                    addUnitOption(toUnitSelect, unit);
                });
            }
            
            // Add special units
            if ((isTemperature || category === 'frequency' || category === 'angle') && units[category].special) {
                units[category].special.forEach(unit => {
                    addUnitOption(fromUnitSelect, unit);
                    addUnitOption(toUnitSelect, unit);
                });
            }
            
            // Set default "to" unit to something different from "from" unit
            if (fromUnitSelect.options.length > 1 && toUnitSelect.options.length > 1) {
                toUnitSelect.selectedIndex = 1;
            }
        }

        function addUnitOption(selectElement, unit) {
            const option = document.createElement('option');
            option.value = unit.symbol;
            option.textContent = `${unit.name} (${unit.symbol})`;
            option.dataset.factor = unit.factor;
            option.dataset.offset = unit.offset || 0;
            selectElement.appendChild(option);
        }

        // Convert units
        function convertUnits() {
            const fromValue = parseFloat(fromValueInput.value);
            if (isNaN(fromValue)) {
                resultValueSpan.textContent = '0';
                resultUnitSpan.textContent = '';
                return;
            }
            
            const fromUnit = fromUnitSelect.options[fromUnitSelect.selectedIndex];
            const toUnit = toUnitSelect.options[toUnitSelect.selectedIndex];
            
            const fromFactor = parseFloat(fromUnit.dataset.factor);
            const fromOffset = parseFloat(fromUnit.dataset.offset);
            const toFactor = parseFloat(toUnit.dataset.factor);
            const toOffset = parseFloat(toUnit.dataset.offset);
            
            let result;
            
            // Special handling for temperature
            if (categorySelect.value === 'temperature') {
                // First convert to Celsius (or Kelvin if from Kelvin)
                let celsius;
                if (fromUnit.value === '°C') {
                    celsius = fromValue;
                } else if (fromUnit.value === '°F') {
                    celsius = (fromValue - 32) * 5/9;
                } else if (fromUnit.value === 'K') {
                    celsius = fromValue - 273.15;
                }
                
                // Then convert from Celsius to target unit
                if (toUnit.value === '°C') {
                    result = celsius;
                } else if (toUnit.value === '°F') {
                    result = celsius * 9/5 + 32;
                } else if (toUnit.value === 'K') {
                    result = celsius + 273.15;
                }
            } else {
                // Standard conversion for other units
                const baseValue = (fromValue - fromOffset) * fromFactor;
                result = baseValue / toFactor + toOffset;
            }
            
            // Format the result
            resultValueSpan.textContent = formatNumber(result);
            resultUnitSpan.textContent = toUnit.value;
            
            // Update the conversion table
            updateConversionTable(fromValue, fromUnit, result, toUnit);
        }

        // Format number with appropriate decimal places
        function formatNumber(num) {
            if (num === 0) return '0';
            const absNum = Math.abs(num);
            if (absNum >= 1000 || absNum <= 0.01) {
                return num.toExponential(4).replace(/(\.\d*?[1-9])0+e/, '$1e');
            } else if (absNum >= 100) {
                return num.toFixed(2);
            } else if (absNum >= 1) {
                return num.toFixed(4).replace(/\.?0+$/, '');
            } else {
                return num.toFixed(6).replace(/\.?0+$/, '');
            }
        }

        // Update the conversion table with common conversions
        function updateConversionTable(fromValue, fromUnit, mainResult, mainToUnit) {
            const category = categorySelect.value;
            const isTemperature = category === 'temperature';
            const isData = category === 'data';
            const allUnits = [];
            
            // Get all available units for this category
            allUnits.push(...units[category].metric);
            if (currentSystem === 'imperial' || isTemperature || isData) {
                const systemKey = isData ? 'binary' : 'imperial';
                allUnits.push(...units[category][systemKey]);
            }
            if ((isTemperature || category === 'frequency' || category === 'angle') && units[category].special) {
                allUnits.push(...units[category].special);
            }
            
            // Generate table rows
            let tableHTML = `
                <thead>
                    <tr>
                        <th>Unit</th>
                        <th>Value</th>
                    </tr>
                </thead>
                <tbody>
            `;
            
            allUnits.forEach(unit => {
                if (unit.symbol === fromUnit.value) return; // Skip the from unit
                
                let convertedValue;
                
                if (isTemperature) {
                    // Convert to Celsius first
                    let celsius;
                    if (fromUnit.value === '°C') {
                        celsius = fromValue;
                    } else if (fromUnit.value === '°F') {
                        celsius = (fromValue - 32) * 5/9;
                    } else if (fromUnit.value === 'K') {
                        celsius = fromValue - 273.15;
                    }
                    
                    // Then convert to target unit
                    if (unit.symbol === '°C') {
                        convertedValue = celsius;
                    } else if (unit.symbol === '°F') {
                        convertedValue = celsius * 9/5 + 32;
                    } else if (unit.symbol === 'K') {
                        convertedValue = celsius + 273.15;
                    }
                } else {
                    // Standard conversion
                    const baseValue = (fromValue - parseFloat(fromUnit.dataset.offset)) * parseFloat(fromUnit.dataset.factor);
                    convertedValue = baseValue / unit.factor + (unit.offset || 0);
                }
                
                // Highlight the main conversion result
                const isMainResult = unit.symbol === mainToUnit.value;
                const rowClass = isMainResult ? 'class="highlight-row"' : '';
                
                tableHTML += `
                    <tr ${rowClass}>
                        <td>${unit.name} (${unit.symbol})</td>
                        <td>${formatNumber(convertedValue)}</td>
                    </tr>
                `;
            });
            
            tableHTML += `</tbody>`;
            conversionResultsTable.innerHTML = tableHTML;
        }

        // Event listeners
        function attachEventListeners() {
            categorySelect.addEventListener('change', () => {
                updateUnitOptions();
                updateResults();
            });
            
            fromValueInput.addEventListener('input', updateResults);
            fromUnitSelect.addEventListener('change', updateResults);
            toUnitSelect.addEventListener('change', updateResults);
            
            swapButton.addEventListener('click', () => {
                const tempIndex = fromUnitSelect.selectedIndex;
                fromUnitSelect.selectedIndex = toUnitSelect.selectedIndex;
                toUnitSelect.selectedIndex = tempIndex;
                updateResults();
            });
            
            clearButton.addEventListener('click', () => {
                fromValueInput.value = '';
                resultValueSpan.textContent = '0';
                resultUnitSpan.textContent = '';
                conversionResultsTable.innerHTML = '';
            });
            
            copyButton.addEventListener('click', () => {
                const resultText = `${resultValueSpan.textContent} ${resultUnitSpan.textContent}`;
                navigator.clipboard.writeText(resultText).then(() => {
                    copyButton.innerHTML = '<i class="fas fa-check"></i> Copied!';
                    setTimeout(() => {
                        copyButton.innerHTML = '<i class="fas fa-copy"></i> Copy';
                    }, 2000);
                });
            });
            
            metricButton.addEventListener('click', () => {
                if (currentSystem !== 'metric') {
                    currentSystem = 'metric';
                    metricButton.classList.add('active');
                    imperialButton.classList.remove('active');
                    updateUnitOptions();
                    updateResults();
                }
            });
            
            imperialButton.addEventListener('click', () => {
                if (currentSystem !== 'imperial') {
                    currentSystem = 'imperial';
                    imperialButton.classList.add('active');
                    metricButton.classList.remove('active');
                    updateUnitOptions();
                    updateResults();
                }
            });
        }

        // Update all results
        function updateResults() {
            convertUnits();
        }

        // Initialize the converter when the page loads
        document.addEventListener('DOMContentLoaded', initConverter);
    </script>
</body>
</html>
